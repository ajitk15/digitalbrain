# Non-secret deployment settings; mount read-only and select using DIGITAL_BRAIN_CONFIG.
mode = "production"
hosts = ["brain.example.com"]
csrf_origins = ["https://brain.example.com"]
secret_directory = "/run/secrets"
# Enable ONLY behind a trusted proxy that strips client-supplied X-Forwarded-Proto.
trust_proxy = false
# How many files one import may take from a GitHub /tree/ link or a SharePoint
# folder. Default 100, permitted range 1-1000. A knowledge base is not a mirror
# of a repository, so the walk stays bounded - reaching the bound is reported to
# the person importing rather than silently truncating their documentation set.
import_max_files = 100

[database]
name = "digital_brain"
user = "digital_brain_app"
host = "postgres.internal.example.com"
port = 5432
sslrootcert = "/etc/ssl/certs/database-ca.pem"

<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<title>Digital Brain - one rule, five files</title>
<style>
:root {
  --bg: #070b17; --ink: #e8eeff; --muted: #8d9abb; --faint: #55617f;
  --teal: #2dd4bf; --violet: #a78bfa; --blue: #60a5fa; --green: #34d399; --amber: #fbbf24;
  --red: #f87171; --orange: #fb923c; --slate: #cbd5e1; --cyan: #22d3ee; --pink: #f472b6;
  --glass: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.028));
  --line: rgba(255,255,255,.12);
  --sans: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", sans-serif;
  --mono: Consolas, "Cascadia Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(45,212,191,.10), transparent 60%),
    radial-gradient(1000px 800px at 105% 110%, rgba(167,139,250,.13), transparent 60%),
    linear-gradient(180deg, #080d1c, #060914); }
#dots { position: absolute; inset: 0;
  background-image: radial-gradient(rgba(148,163,209,.13) 1.2px, transparent 1.3px);
  background-size: 32px 32px; mask-image: radial-gradient(1300px 800px at 50% 50%, #000 40%, transparent 100%); }
.blob { position: absolute; width: 700px; height: 700px; border-radius: 50%; filter: blur(110px); opacity: .22; }
.abs { position: absolute; }
.glass { position: absolute; background: var(--glass); border: 1px solid var(--line); border-radius: 22px;
  box-shadow: 0 24px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); backdrop-filter: blur(16px); }
.scene { position: absolute; inset: 0; }
/* chrome */
#progress { position: absolute; left: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--teal), var(--violet)); box-shadow: 0 0 18px rgba(45,212,191,.7); }
#ticks { position: absolute; left: 0; top: 0; width: 1920px; height: 4px; }
#ticks i { position: absolute; top: 0; width: 2px; height: 10px; background: rgba(255,255,255,.25); }
#brand { left: 80px; top: 34px; font-size: 17px; letter-spacing: .22em; font-weight: 700; color: var(--teal); }
#brand b { color: var(--muted); font-weight: 600; }
#chapter { left: 80px; top: 62px; font-size: 50px; font-weight: 700; letter-spacing: -.01em; }
#chapter span { color: var(--faint); font-weight: 600; margin-right: 18px; font-variant-numeric: tabular-nums; }
#tech { right: 70px; top: 70px; display: flex; gap: 10px; justify-content: flex-end; }
.chip { display: inline-flex; align-items: center; gap: 9px; padding: 8px 16px; border-radius: 999px; font-size: 19px; font-weight: 600;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); color: var(--ink); white-space: nowrap; }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 10px currentColor; }
#foot { left: 80px; top: 902px; font-size: 17px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
#caption { left: 0; right: 0; margin: 0 auto; width: fit-content; bottom: 34px; max-width: 1560px; padding: 14px 32px; border-radius: 18px;
  background: rgba(5,8,18,.78); border: 1px solid rgba(255,255,255,.10); font-size: 33px; font-weight: 500; line-height: 1.3;
  text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.5); white-space: normal; }
/* shared bits */
.title { font-size: 26px; font-weight: 700; }
.sub { font-size: 18px; color: var(--muted); }
.kicker { font-size: 15px; letter-spacing: .18em; font-weight: 700; text-transform: uppercase; }
.badge { position: absolute; display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; font-size: 18px; font-weight: 700; white-space: nowrap; }
.ok { color: #052e22; background: var(--green); }
.warn { color: #3b2400; background: var(--amber); }
.bad { color: #3b0a0a; background: var(--red); }
.ftype { display: inline-flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 14px; font: 800 15px var(--sans); letter-spacing: .04em; color: #071018; }
.quote { font-size: 23px; line-height: 1.38; color: #d9e2ff; font-style: italic; }
svg { overflow: visible; }
svg text { font-family: var(--sans); }
.mono { font-family: var(--mono); }
/* spreadsheet + editor */
.sheet { overflow: hidden; }
.grid { position: absolute; left: 0; right: 0; top: 104px; display: grid; grid-template-columns: 44px 1.6fr 1.1fr .9fr; font-size: 17px; }
.grid div { height: 52px; padding: 0 12px; border-right: 1px solid rgba(255,255,255,.07); border-bottom: 1px solid rgba(255,255,255,.07);
  display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d4dcf5; }
.grid .h { background: rgba(255,255,255,.05); color: var(--muted); justify-content: center; font-size: 14px; height: 30px; }
.grid .n { color: var(--muted); justify-content: center; font-size: 14px; background: rgba(255,255,255,.03); }
.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; display: flex; gap: 2px; padding: 0 10px; align-items: flex-end;
  background: rgba(255,255,255,.04); border-top: 1px solid rgba(255,255,255,.08); }
.tabs span { padding: 8px 12px; font-size: 14px; color: var(--muted); border-radius: 8px 8px 0 0; white-space: nowrap; }
.tabs .on { background: rgba(52,211,153,.18); color: var(--green); font-weight: 700; }
.editor .bar { height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 17px; color: var(--muted); }
.editor .bar i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.code { padding: 14px 0; font: 19.5px/34px var(--mono); }
.code div { position: relative; padding-left: 64px; white-space: pre; color: #dfe6ff; }
.code div b { position: absolute; left: 0; width: 44px; text-align: right; color: #48557a; font-weight: 400; }
.md-h { color: var(--violet); font-weight: 700; }
.md-p { color: #56638a; }
.hl { position: absolute; left: 6px; right: 6px; height: 34px; border-radius: 8px; }
/* quality */
.qrow { position: absolute; left: 34px; right: 34px; height: 92px; display: grid; grid-template-columns: 54px 1fr 190px; align-items: center; gap: 16px;
  border-top: 1px solid rgba(255,255,255,.07); }
.qrow .ic { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(52,211,153,.15); }
.qrow .lab { font-size: 23px; font-weight: 700; }
.qrow .fin { font-size: 17px; color: var(--muted); margin-top: 3px; }
.qrow .pts { text-align: right; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.track { height: 8px; border-radius: 9px; background: rgba(255,255,255,.08); margin-top: 8px; overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, var(--teal), var(--green)); }
.cell { display: inline-block; width: 34px; height: 34px; border-radius: 7px; margin: 0 6px 6px 0; background: rgba(255,255,255,.07); }
</style>
</head>
<body>
<div id="stage">
  <div id="dots"></div>
  <div class="blob" id="blob1" style="background:#2dd4bf"></div>
  <div class="blob" id="blob2" style="background:#a78bfa"></div>
  <div id="scenes"></div>
  <svg id="graph" class="abs" width="1920" height="1080" viewBox="0 0 1920 1080" style="left:0;top:0">
    <defs>
      <radialGradient id="nodeFill" cx="40%" cy="30%" r="80%">
        <stop offset="0" stop-color="#1b2647"/><stop offset="1" stop-color="#0b1124"/>
      </radialGradient>
      <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    </defs>
    <g id="g-all"><g id="g-halo"></g><g id="g-ev"></g><g id="g-struct"></g><g id="g-docs"></g><g id="g-biz"></g></g>
  </svg>
  <div id="overlays"></div>
  <div class="abs" id="brand">DIGITAL BRAIN <b>· CAREPATH</b></div>
  <div class="abs" id="chapter"></div>
  <div class="abs" id="tech"></div>
  <div class="abs" id="foot"></div>
  <div class="abs" id="caption"></div>
  <div id="ticks"></div>
  <div id="progress"></div>
</div>
<script src="timeline.js"></script>
<script src="scene.js"></script>
</body>
</html>

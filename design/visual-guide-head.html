<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Digital Brain — Visual architecture guide</title><style>
:root{color-scheme:light;--bg:#f3f5f6;--paper:#fff;--ink:#1d3042;--muted:#526777;--line:#d7e1e6;--accent:#086e70;--soft:#e9f5f1;--warm:#fff4df;--code:#f2f5f8}
:root[data-theme=dark]{color-scheme:dark;--bg:#111b25;--paper:#182633;--ink:#eaf1f7;--muted:#b6c8d4;--line:#354956;--accent:#83d9ce;--soft:#203d3d;--warm:#403821;--code:#223443}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Segoe UI',Arial,sans-serif}a{color:var(--accent);text-underline-offset:4px}button,a,summary{outline-offset:5px}button{font:inherit;font-size:13px;background:var(--paper);color:var(--ink);padding:8px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}.bar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:15px 32px;background:var(--paper);border-bottom:1px solid var(--line)}.bar>div{display:flex;gap:12px;align-items:center}.bar a{font-size:14px}.bar .brand{font-size:22px;font-weight:750;text-decoration:none;color:var(--ink)}.brand span{color:var(--accent)}.layout{display:grid;grid-template-columns:225px minmax(0,1fr);gap:40px;max-width:1540px;margin:auto;padding:28px 32px}aside{position:sticky;top:100px;align-self:start}nav a{display:block;font-size:14px;padding:9px 0;text-decoration:none;color:var(--muted)}nav a:hover{color:var(--accent)}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}.small,small,.caption{font-size:13px;color:var(--muted)}main{min-width:0}.hero{padding:22px 0 38px}.hero h1{font-size:clamp(36px,4.4vw,62px);letter-spacing:-2px;line-height:1.08;margin:20px 0}.lede{font-size:20px;color:var(--muted);max-width:690px}section{margin-bottom:30px;border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:30px}.section-head{display:flex;gap:15px;align-items:center;margin-bottom:22px}.section-head>span{font:700 14px Consolas,monospace;color:var(--accent);background:var(--soft);padding:8px;border-radius:9px}h2{font-size:27px;letter-spacing:-.7px;line-height:1.3;margin:0}h3{font-size:18px;line-height:1.35;margin:12px 0}p{margin:10px 0}section>p{color:var(--muted)}.two,.three{display:grid;gap:16px;margin:20px 0}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}.card p{font-size:14px;color:var(--muted)}.featured{background:var(--soft);border-color:var(--accent)}.icon{font:700 12px Consolas,monospace;color:var(--accent)}.sample,pre{font:13px/1.8 Consolas,monospace;background:var(--code);padding:12px;border-radius:7px;overflow-wrap:anywhere;white-space:pre-wrap}.sample{margin-top:18px}.band{background:var(--soft);padding:18px 22px;border-radius:10px;margin-top:20px}.band p{font-size:14px}.example{background:var(--paper);border-left:4px solid var(--accent);padding:18px 22px;margin-top:22px;border-radius:0 12px 12px 0}.hero .example{max-width:720px}.example>strong{display:block;font-size:20px}.tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:750;color:var(--accent)}.hierarchy{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}.hierarchy>div{padding:12px;border-right:1px solid var(--line)}.hierarchy>div:last-child{border:0}.hierarchy small,.hierarchy strong{display:block}.hierarchy small{font-size:11px}.hierarchy strong{font-size:14px}.selected{background:var(--soft)}.boundary{border:2px dashed var(--accent)}.rule{border-left:3px solid var(--accent);padding:12px 18px;background:var(--soft);font-size:14px}.table-wrap{overflow-x:auto;margin:22px 0;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;font-size:14px;text-align:left}th,td{padding:13px 15px;border-bottom:1px solid var(--line);vertical-align:top;min-width:120px}th{background:var(--soft);font-weight:650}tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}tbody tr:nth-child(even){background:var(--bg)}.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:22px 0}.steps article{border-top:2px solid var(--line);padding:16px 8px;min-width:0}.steps b{display:inline-grid;place-items:center;background:var(--accent);color:var(--paper);width:28px;height:28px;border-radius:50%;font-size:13px}.steps p{font-size:14px;color:var(--muted)}code{font:12px/1.6 Consolas,monospace;overflow-wrap:anywhere;background:var(--code);padding:3px 5px;border-radius:4px}dl{display:grid;grid-template-columns:90px 1fr;font-size:14px;gap:8px;margin:16px 0 0}dt{color:var(--muted)}dd{margin:0}details{border-top:1px solid var(--line);padding-top:16px;margin-top:20px;font-size:14px}summary{cursor:pointer;font-weight:650;color:var(--accent)}details p{color:var(--muted)}.stat{background:var(--soft);padding:16px 20px;border-radius:10px}.stat p{font-size:14px;color:var(--muted)}.note{padding:18px;border-radius:10px}.note p{font-size:14px}.good{background:var(--soft)}.warn{background:var(--warm)}.chat{background:var(--bg);border-radius:12px;padding:24px;margin:20px 0}.question{font-size:20px}.answer{background:var(--paper);border:1px solid var(--line);padding:16px;border-radius:10px;margin-left:24px}.citation{display:inline-block;font-size:12px;color:var(--accent)}.timeline{list-style:none;padding:0;counter-reset:st}.timeline li{counter-increment:st;position:relative;padding:16px 18px 16px 56px;margin:10px 0;background:var(--bg);border-radius:10px}.timeline li:before{content:counter(st);position:absolute;left:18px;top:16px;color:var(--accent);font-weight:750}.timeline strong,.timeline span{display:block}.timeline span{font-size:14px;color:var(--muted);margin-top:4px}.timeline .gate{background:var(--warm);border:1px solid var(--line)}.links a{font-size:14px;text-decoration:none;font-weight:650}footer{padding:20px 0 40px;font-size:13px;color:var(--muted)}footer a{display:inline-block;margin-top:12px}
@media(min-width:1700px){.layout{gap:55px}section{padding:36px}}@media(max-width:1100px){.layout{grid-template-columns:180px minmax(0,1fr);gap:24px;padding:24px}section{padding:22px}.three,.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.hierarchy{grid-template-columns:1fr}.hierarchy>div{display:flex;justify-content:space-between;border-right:0;border-bottom:1px solid var(--line)}}@media(max-width:760px){.bar{position:relative;padding:14px;align-items:flex-start}.bar>div{gap:8px;flex-wrap:wrap;justify-content:flex-end}.bar>div>a{display:none}.layout{display:block;padding:16px}aside{position:static}nav{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;border-bottom:1px solid var(--line);padding-bottom:12px}nav a{font-size:12px}aside .small{display:none}.hero h1{font-size:40px}.hero{padding-top:14px}section{padding:18px;border-radius:12px}.two,.three,.steps{grid-template-columns:1fr}h2{font-size:23px}.section-head{gap:10px}.answer{margin-left:0}.card{padding:18px}.table-wrap th,.table-wrap td{padding:10px}.lede{font-size:18px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}@media print{.bar,aside{display:none}.layout{display:block;padding:0}body{background:white;color:black;font-size:10pt}section{break-inside:auto;page-break-before:always;border:0;padding:0}section:first-of-type{page-break-before:auto}.card,.steps article,.timeline li,tr{break-inside:avoid}.hero h1{font-size:32pt}.table-wrap{overflow:visible}a{color:inherit}details{display:block}}
</style></head><body><a href="#overview" style="position:absolute;left:-10000px" onfocus="this.style.left='16px'" onblur="this.style.left='-10000px'">Skip to overview</a>

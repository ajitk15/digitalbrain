# Digital Brain split into a migration job, web containers, a worker, a
# sandbox and clamd.
#
#   docker compose -f docker-compose.yaml -f docker-compose.scale.yaml up -d
#
# An overlay on docker-compose.yaml, which on its own still runs everything in
# one container exactly as before. With this file:
#
# * "migrate" runs once per deploy (DIGITAL_BRAIN_ROLE=migrate): it applies
#   migrations, writes the signing key if there is none, checks the deployment
#   settings and exits. Nothing else starts until it has exited cleanly, so a
#   migration that fails stops the deploy before any container serves on the
#   new code.
# * "app" serves requests only (DIGITAL_BRAIN_ROLE=web) and applies nothing
#   (DIGITAL_BRAIN_MIGRATIONS=wait). That is what lets it run as more than one
#   replica: DIGITAL_BRAIN_WEB_REPLICAS, 1 unless set. Sessions, sign-in
#   lockouts and jobs are in the database, and streams, Stop and the API rate
#   limit in Redis, so any replica can answer any request.
# * "worker" runs the background lanes (`manage.py run_worker`) that read only
#   this platform's own records. A deploy of the web container no longer stops
#   an import or a Code Factory phase half way, and a long provider call no
#   longer shares a process with sign-in.
# * "sandbox" runs the three lanes that hand content from outside to another
#   program: intake gives uploads to the converters, OCR and the virus scan,
#   code-graph gives repositories to git, factory gives a repository's code to
#   the Claude CLI. A parser bug in a hostile file, a fork bomb in a hook that
#   should never run, a converter that never returns - each is held to this
#   container: it serves no request, writes only /tmp and the runtime volume,
#   has no Linux capabilities and cannot gain one, reads every credential
#   read-only, and stops at a process and a memory limit.
# * "clamd" scans documents. clamscan loaded the whole signature database for
#   every file; the daemon loads it once. processing.py still refuses
#   signatures more than a week old, by asking the daemon for their date.
#
# Every lane but maintenance claims its work row by row
# (document_worker.SHARED_LANES), so worker and sandbox replicas share their
# lanes and nothing runs twice. Maintenance is held by one process at a time (a
# PostgreSQL advisory lock, document_worker.LaneKeeper); a second worker
# replica stands by for it. Each lane belongs to exactly one of the two
# services, which a test checks against document_worker.LANES.
#
# Migrations are applied under a lock (manage.py apply_migrations) wherever
# they run, so even two migrate jobs at once apply each migration once. The new
# schema is in place before the old web containers stop, which is why every
# migration has to be one the previous release can still run against.
#
# More than one web replica needs a platform that lets a service have several
# containers. Some name each container themselves, which allows only one per
# service; leave DIGITAL_BRAIN_WEB_REPLICAS unset there.

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: demo
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
    environment:
      DIGITAL_BRAIN_ROLE: "migrate"
      DIGITAL_BRAIN_DEMONSTRATION: "1"
      # The same settings the web container renders, so `check --deploy` here
      # judges the configuration the web container is about to serve with.
      DIGITAL_BRAIN_HOSTS: "ajitconnect.in,www.ajitconnect.in"
      DIGITAL_BRAIN_INSTANCE: "coolify-1-migrate"
      DIGITAL_BRAIN_CLAMD: "clamd:3310"
      DIGITAL_BRAIN_REDIS: "redis:6379"
      # Uploaded originals in S3, as in development; its keys are the mounted
      # files originals_access_key_id and originals_secret_access_key.
      DIGITAL_BRAIN_ORIGINALS_BUCKET: "digital-brain-originals-prod"
      DIGITAL_BRAIN_ORIGINALS_REGION: "us-west-2"
    volumes:
      - platform-secrets:/run/secrets
      - postgres-certs:/var/lib/digitalbrain/pgcerts:ro
      - managed-credentials:/var/lib/digitalbrain/credentials
      - demo-workspace:/var/lib/digitalbrain/demo
      - connector-credentials:/var/lib/digitalbrain/connectors:ro
      - app-runtime:/app/.runtime

  app:
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DIGITAL_BRAIN_ROLE: "web"
      DIGITAL_BRAIN_MIGRATIONS: "wait"
      DIGITAL_BRAIN_CLAMD: "clamd:3310"
    deploy:
      replicas: ${DIGITAL_BRAIN_WEB_REPLICAS:-1}
    healthcheck:
      # No signatures to download in a web container, so it listens within
      # seconds; the base file's ten minutes would hide a replica that never does.
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: demo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamd:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      DIGITAL_BRAIN_ROLE: "worker"
      DIGITAL_BRAIN_DEMONSTRATION: "1"
      DIGITAL_BRAIN_CLAMD: "clamd:3310"
      DIGITAL_BRAIN_REDIS: "redis:6379"
      # Uploaded originals in S3, as in development; its keys are the mounted
      # files originals_access_key_id and originals_secret_access_key.
      DIGITAL_BRAIN_ORIGINALS_BUCKET: "digital-brain-originals-prod"
      DIGITAL_BRAIN_ORIGINALS_REGION: "us-west-2"
      # Settings are read in full by the worker too, so it needs the same
      # non-secret values the web container renders its configuration from.
      DIGITAL_BRAIN_HOSTS: "ajitconnect.in,www.ajitconnect.in"
      DIGITAL_BRAIN_INSTANCE: "coolify-1-worker"
      DIGITAL_BRAIN_LANES: "graph,connectors,serviceops,serviceops-tests,automations,maintenance"
    volumes:
      - platform-secrets:/run/secrets
      - postgres-certs:/var/lib/digitalbrain/pgcerts:ro
      - managed-credentials:/var/lib/digitalbrain/credentials
      - demo-workspace:/var/lib/digitalbrain/demo
      - connector-credentials:/var/lib/digitalbrain/connectors:ro
      # The rendered configuration. The sandbox reads uploaded originals from
      # the same volume; one host for all until originals move to object storage.
      - app-runtime:/app/.runtime
    # A stop is honoured between steps. run_worker lets one in progress finish
    # for up to 50 s before it exits; this has to be longer than that.
    stop_grace_period: 70s
    healthcheck:
      # Only this service's own lanes: the other service's going down is its
      # own health check's to report, not a reason to restart this one.
      test: ["CMD-SHELL", "python manage.py queue_status --check --lanes \"$$DIGITAL_BRAIN_LANES\""]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      target: demo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamd:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      DIGITAL_BRAIN_ROLE: "worker"
      DIGITAL_BRAIN_DEMONSTRATION: "1"
      DIGITAL_BRAIN_LANES: "intake,code-graph,factory"
      # Threads for a lane: each claims its own row and holds a database
      # connection while it works, so count them against max_connections.
      DIGITAL_BRAIN_CONCURRENCY: "intake=2"
      DIGITAL_BRAIN_CLAMD: "clamd:3310"
      DIGITAL_BRAIN_REDIS: "redis:6379"
      # Uploaded originals in S3, as in development; its keys are the mounted
      # files originals_access_key_id and originals_secret_access_key.
      DIGITAL_BRAIN_ORIGINALS_BUCKET: "digital-brain-originals-prod"
      DIGITAL_BRAIN_ORIGINALS_REGION: "us-west-2"
      DIGITAL_BRAIN_HOSTS: "ajitconnect.in,www.ajitconnect.in"
      DIGITAL_BRAIN_INSTANCE: "coolify-1-sandbox"
    volumes:
      # Read, never written: the signing key and every credential are made by
      # the migrate job and the web container, never here.
      - platform-secrets:/run/secrets:ro
      - postgres-certs:/var/lib/digitalbrain/pgcerts:ro
      - managed-credentials:/var/lib/digitalbrain/credentials:ro
      - demo-workspace:/var/lib/digitalbrain/demo
      - connector-credentials:/var/lib/digitalbrain/connectors:ro
      # Uploaded originals to convert, and the rendered configuration.
      - app-runtime:/app/.runtime
    read_only: true
    tmpfs:
      # Clones, conversions and each Claude CLI run's empty home are scratch
      # directories under here, gone with the container.
      - /tmp:size=4g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    mem_limit: 6g
    stop_grace_period: 70s
    healthcheck:
      # Only this service's own lanes: the other service's going down is its
      # own health check's to report, not a reason to restart this one.
      test: ["CMD-SHELL", "python manage.py queue_status --check --lanes \"$$DIGITAL_BRAIN_LANES\""]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s

  clamd:
    image: clamav/clamav:1.4
    restart: unless-stopped
    # Reached over the compose network only, like the web listener.
    expose:
      - "3310"
    volumes:
      # Its own volume: the image runs as its own user, and the clamav-db
      # volume the all-in-one container uses is owned by uid 10001.
      - clamd-db:/var/lib/clamav

volumes:
  clamd-db:

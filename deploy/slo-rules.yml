# Generated by platform_core/slo.py - `manage.py slo --rules`. Do not edit.
groups:
  - name: digital-brain-slo-ratios
    rules:
      - record: digitalbrain:slo_errors:ratio_rate1h
        expr: '(sum(rate(http_server_request_duration_seconds_count{digitalbrain_streamed="false",http_response_status_code=~"5.."}[1h]))) / (sum(rate(http_server_request_duration_seconds_count{digitalbrain_streamed="false"}[1h])))'
        labels:
          objective: requests_available
      - record: digitalbrain:slo_errors:ratio_rate6h
        expr: '(sum(rate(http_server_request_duration_seconds_count{digitalbrain_streamed="false",http_response_status_code=~"5.."}[6h]))) / (sum(rate(http_server_request_duration_seconds_count{digitalbrain_streamed="false"}[6h])))'
        labels:
          objective: requests_available
      - record: digitalbrain:slo_errors:ratio_rate5m
        expr: '(sum(rate(http_server_request_duration_seconds_count{digitalbrain_streamed="false",http_response_status_code=~"5.."}[5m]))) / (sum(rate(http_server_request_duration_seconds_count{digitalbrain_streamed="false"}[5m])))'
        labels:
          objective: requests_available
      - record: digitalbrain:slo_errors:ratio_rate30m
        expr: '(sum(rate(http_server_request_duration_seconds_count{digitalbrain_streamed="false",http_response_status_code=~"5.."}[30m]))) / (sum(rate(http_server_request_duration_seconds_count{digitalbrain_streamed="false"}[30m])))'
        labels:
          objective: requests_available
      - record: digitalbrain:slo_errors:ratio_rate1h
        expr: '((sum(rate(http_server_request_duration_seconds_count{digitalbrain_streamed="false",http_request_method="GET"}[1h])) - sum(rate(http_server_request_duration_seconds_bucket{digitalbrain_streamed="false",http_request_method="GET",le=~"1(.0)?"}[1h])))) / (sum(rate(http_server_request_duration_seconds_count{digitalbrain_streamed="false",http_request_method="GET"}[1h])))'
        labels:
          objective: pages_fast
      - record: digitalbrain:slo_errors:ratio_rate6h
        expr: '((sum(rate(http_server_request_duration_seconds_count{digitalbrain_streamed="false",http_request_method="GET"}[6h])) - sum(rate(http_server_request_duration_seconds_bucket{digitalbrain_streamed="false",http_request_method="GET",le=~"1(.0)?"}[6h])))) / (sum(rate(http_server_request_duration_seconds_count{digitalbrain_streamed="false",http_request_method="GET"}[6h])))'
        labels:
          objective: pages_fast
      - record: digitalbrain:slo_errors:ratio_rate5m
        expr: '((sum(rate(http_server_request_duration_seconds_count{digitalbrain_streamed="false",http_request_method="GET"}[5m])) - sum(rate(http_server_request_duration_seconds_bucket{digitalbrain_streamed="false",http_request_method="GET",le=~"1(.0)?"}[5m])))) / (sum(rate(http_server_request_duration_seconds_count{digitalbrain_streamed="false",http_request_method="GET"}[5m])))'
        labels:
          objective: pages_fast
      - record: digitalbrain:slo_errors:ratio_rate30m
        expr: '((sum(rate(http_server_request_duration_seconds_count{digitalbrain_streamed="false",http_request_method="GET"}[30m])) - sum(rate(http_server_request_duration_seconds_bucket{digitalbrain_streamed="false",http_request_method="GET",le=~"1(.0)?"}[30m])))) / (sum(rate(http_server_request_duration_seconds_count{digitalbrain_streamed="false",http_request_method="GET"}[30m])))'
        labels:
          objective: pages_fast
      - record: digitalbrain:slo_errors:ratio_rate1h
        expr: '(sum(rate(digitalbrain_ai_admission_wait_seconds_count{digitalbrain_outcome="busy"}[1h]))) / (sum(rate(digitalbrain_ai_admission_wait_seconds_count[1h])))'
        labels:
          objective: ai_admitted
      - record: digitalbrain:slo_errors:ratio_rate6h
        expr: '(sum(rate(digitalbrain_ai_admission_wait_seconds_count{digitalbrain_outcome="busy"}[6h]))) / (sum(rate(digitalbrain_ai_admission_wait_seconds_count[6h])))'
        labels:
          objective: ai_admitted
      - record: digitalbrain:slo_errors:ratio_rate5m
        expr: '(sum(rate(digitalbrain_ai_admission_wait_seconds_count{digitalbrain_outcome="busy"}[5m]))) / (sum(rate(digitalbrain_ai_admission_wait_seconds_count[5m])))'
        labels:
          objective: ai_admitted
      - record: digitalbrain:slo_errors:ratio_rate30m
        expr: '(sum(rate(digitalbrain_ai_admission_wait_seconds_count{digitalbrain_outcome="busy"}[30m]))) / (sum(rate(digitalbrain_ai_admission_wait_seconds_count[30m])))'
        labels:
          objective: ai_admitted
      - record: digitalbrain:slo_errors:ratio_rate1h
        expr: '(max(avg_over_time((max(digitalbrain_queue_oldest_age_seconds{lane=~"intake|graph|connectors"}) > bool 600)[1h:1m]))) / (vector(1))'
        labels:
          objective: queues_fresh
      - record: digitalbrain:slo_errors:ratio_rate6h
        expr: '(max(avg_over_time((max(digitalbrain_queue_oldest_age_seconds{lane=~"intake|graph|connectors"}) > bool 600)[6h:1m]))) / (vector(1))'
        labels:
          objective: queues_fresh
      - record: digitalbrain:slo_errors:ratio_rate5m
        expr: '(max(avg_over_time((max(digitalbrain_queue_oldest_age_seconds{lane=~"intake|graph|connectors"}) > bool 600)[5m:1m]))) / (vector(1))'
        labels:
          objective: queues_fresh
      - record: digitalbrain:slo_errors:ratio_rate30m
        expr: '(max(avg_over_time((max(digitalbrain_queue_oldest_age_seconds{lane=~"intake|graph|connectors"}) > bool 600)[30m:1m]))) / (vector(1))'
        labels:
          objective: queues_fresh
  - name: digital-brain-slo-alerts
    rules:
      - alert: SLOAnswersFinishTicket
        expr: 'sum(digitalbrain_slo_events{objective="answers_finish",outcome="good"}) / sum(digitalbrain_slo_events{objective="answers_finish"}) < 0.99 and sum(digitalbrain_slo_events{objective="answers_finish"}) >= 20'
        for: 15m
        labels:
          severity: ticket
          objective: answers_finish
        annotations:
          summary: 'Answers end with an answer, not a failure - below target over 28 days'
      - alert: SLOAnswersInTimeTicket
        expr: 'sum(digitalbrain_slo_events{objective="answers_in_time",outcome="good"}) / sum(digitalbrain_slo_events{objective="answers_in_time"}) < 0.95 and sum(digitalbrain_slo_events{objective="answers_in_time"}) >= 20'
        for: 15m
        labels:
          severity: ticket
          objective: answers_in_time
        annotations:
          summary: 'A complete answer ends within 60 seconds of being asked - below target over 28 days'
      - alert: SLOWorkStartsTicket
        expr: 'sum(digitalbrain_slo_events{objective="work_starts",outcome="good"}) / sum(digitalbrain_slo_events{objective="work_starts"}) < 0.99 and sum(digitalbrain_slo_events{objective="work_starts"}) >= 20'
        for: 15m
        labels:
          severity: ticket
          objective: work_starts
        annotations:
          summary: 'Background work starts within 5 minutes of falling due - below target over 28 days'
      - alert: SLOWorkSucceedsTicket
        expr: 'sum(digitalbrain_slo_events{objective="work_succeeds",outcome="good"}) / sum(digitalbrain_slo_events{objective="work_succeeds"}) < 0.99 and sum(digitalbrain_slo_events{objective="work_succeeds"}) >= 20'
        for: 15m
        labels:
          severity: ticket
          objective: work_succeeds
        annotations:
          summary: 'Background work finishes rather than using every attempt - below target over 28 days'
      - alert: SLORequestsAvailablePage
        expr: 'digitalbrain:slo_errors:ratio_rate1h{objective="requests_available"} > 0.0144 and digitalbrain:slo_errors:ratio_rate5m{objective="requests_available"} > 0.0144'
        for: 2m
        labels:
          severity: page
          objective: requests_available
        annotations:
          summary: 'A request is answered without a server error - burning 14.4x over 1h'
      - alert: SLORequestsAvailableTicket
        expr: 'digitalbrain:slo_errors:ratio_rate6h{objective="requests_available"} > 0.006 and digitalbrain:slo_errors:ratio_rate30m{objective="requests_available"} > 0.006'
        for: 15m
        labels:
          severity: ticket
          objective: requests_available
        annotations:
          summary: 'A request is answered without a server error - burning 6x over 6h'
      - alert: SLOPagesFastPage
        expr: 'digitalbrain:slo_errors:ratio_rate1h{objective="pages_fast"} > 0.72 and digitalbrain:slo_errors:ratio_rate5m{objective="pages_fast"} > 0.72'
        for: 2m
        labels:
          severity: page
          objective: pages_fast
        annotations:
          summary: 'A page is served in under 1 second - burning 14.4x over 1h'
      - alert: SLOPagesFastTicket
        expr: 'digitalbrain:slo_errors:ratio_rate6h{objective="pages_fast"} > 0.3 and digitalbrain:slo_errors:ratio_rate30m{objective="pages_fast"} > 0.3'
        for: 15m
        labels:
          severity: ticket
          objective: pages_fast
        annotations:
          summary: 'A page is served in under 1 second - burning 6x over 6h'
      - alert: SLOAiAdmittedPage
        expr: 'digitalbrain:slo_errors:ratio_rate1h{objective="ai_admitted"} > 0.144 and digitalbrain:slo_errors:ratio_rate5m{objective="ai_admitted"} > 0.144'
        for: 2m
        labels:
          severity: page
          objective: ai_admitted
        annotations:
          summary: 'A paid call is admitted rather than turned away busy - burning 14.4x over 1h'
      - alert: SLOAiAdmittedTicket
        expr: 'digitalbrain:slo_errors:ratio_rate6h{objective="ai_admitted"} > 0.06 and digitalbrain:slo_errors:ratio_rate30m{objective="ai_admitted"} > 0.06'
        for: 15m
        labels:
          severity: ticket
          objective: ai_admitted
        annotations:
          summary: 'A paid call is admitted rather than turned away busy - burning 6x over 6h'
      - alert: SLOQueuesFreshPage
        expr: 'digitalbrain:slo_errors:ratio_rate1h{objective="queues_fresh"} > 0.144 and digitalbrain:slo_errors:ratio_rate5m{objective="queues_fresh"} > 0.144'
        for: 2m
        labels:
          severity: page
          objective: queues_fresh
        annotations:
          summary: 'Intake, graph and import work waits under 10 minutes - burning 14.4x over 1h'
      - alert: SLOQueuesFreshTicket
        expr: 'digitalbrain:slo_errors:ratio_rate6h{objective="queues_fresh"} > 0.06 and digitalbrain:slo_errors:ratio_rate30m{objective="queues_fresh"} > 0.06'
        for: 15m
        labels:
          severity: ticket
          objective: queues_fresh
        annotations:
          summary: 'Intake, graph and import work waits under 10 minutes - burning 6x over 6h'

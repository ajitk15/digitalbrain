# Digital Brain on Coolify, behind Coolify's own proxy.
#
# Copy to /opt/digitalbrain/config/production.toml on the VPS. Non-secret: this
# file names things, it never contains a credential. Every secret is a separate
# owner-only file under /opt/digitalbrain/secrets, which the container sees at
# /run/secrets.
mode = "production"
# Every hostname the proxy may forward under. A request whose Host header is
# not listed is refused with 400 - which is the check working, but it looks
# like a broken deployment, so both names a domain is served under belong here.
hosts = ["ajitconnect.in", "www.ajitconnect.in"]
csrf_origins = ["https://ajitconnect.in", "https://www.ajitconnect.in"]
secret_directory = "/run/secrets"

# Coolify's proxy terminates TLS and sets X-Forwarded-Proto. This makes Django
# read it. It is only safe because the proxy is the sole thing that can reach
# the listener - the app publishes no ports - and because waitress is told to
# clear any forwarded header the proxy did not set itself. See the note on
# --trusted-proxy in scripts/serve.py before changing either.
trust_proxy = true

# ClamAV, installed in the image. processing.py refuses to convert a document
# when this is unset or not an absolute path to a real file, so a deployment
# cannot quietly end up storing unscanned uploads.
scanner = "/usr/bin/clamscan"

# How many files one GitHub /tree/ or SharePoint folder import may take.
import_max_files = 100

# Lets whoever starts a Code Factory run approve the plan it produced. On
# unless written down as false: a single-operator instance has nobody to ask and
# would otherwise deadlock at the review gate. A deployment with more than one
# person should set it to false, so a second member holding "May approve Code
# Factory plans" reviews every plan. Every plan approved by its author records
# that in the audit record.
allow_self_approval = true

# Optional. Lets an application owner set their own provider credentials on the
# Credentials screen instead of asking you for each one. Must be writable by the
# service account and MUST differ from secret_directory, which is read-only: a
# credential you project always takes precedence over one typed in a browser.
# Uncomment only after creating the directory and its volume.
# managed_secret_directory = "/var/lib/digitalbrain/credentials"

# Optional. One shared set of connector credentials used by every application
# that has none of its own: files named jira, git_read, git_write, servicenow.
# Gives up per-application isolation for connectors - leave unset where
# applications belong to different teams.
# connector_secret_directory = "/run/connector-secrets"

# Only when more than one server process serves this instance and there is no
# Redis. Each streamed chat answer then holds a database lease, so Stop and "is
# this answer still being written?" reach every process. One process (the
# default) needs nothing. Not with [redis] below, which does this and more.
# shared_streams = true

# Optional. Chat answers stream through Redis: a dropped connection resumes
# where it left off, on any web process, and Stop and the API rate limit reach
# every process. The password is the mounted file redis_password; production
# requires verified TLS. Redis holds copies in transit, never a record.
# [redis]
# host = "redis"
# port = 6379
# tls = true
# ca_certificate = "/var/lib/digitalbrain/pgcerts/ca.crt"

# Optional. How long audit events and AI usage receipts are kept, in days.
# Absent or 0 keeps everything, which is the default; anything shorter than six
# years of audit trail (2192) or 400 days of receipts is refused. Removed oldest
# first, a batch at a time, from the maintenance lane (platform_core/retention.py).
# [retention]
# audit_days = 2192
# usage_days = 400

[database]
name = "digital_brain"
# The role this process connects as. The entrypoint renders the runtime role
# here, which can read and write rows and nothing else, with its password in
# the mounted file database_runtime_password:
#   user = "digital_brain_runtime"
#   password_secret = "database_runtime_password"
# and the migrate step reads a copy that connects as the owner and names the
# role to create:
#   user = "digital_brain_app"
#   runtime_user = "digital_brain_runtime"
# A file mounted here is used for both, so it connects as one role throughout.
user = "digital_brain_app"
# The compose service name. It has to match the certificate's SAN exactly, or
# sslmode=verify-full rejects a certificate that is otherwise perfectly valid.
host = "postgres"
port = 5432
# Generated by the postgres-certs service on first boot and mounted read-only.
sslrootcert = "/var/lib/digitalbrain/pgcerts/ca.crt"

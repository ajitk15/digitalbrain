# Prometheus for docker-compose.observability.yaml: scrapes the collector and
# loads the service-level rules generated from platform_core/slo.py.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/slo-rules.yml

scrape_configs:
  - job_name: digitalbrain
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

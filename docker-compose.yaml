# Digital Brain on Coolify.
#
# Self-contained: no host directory has to exist before the first deploy, and
# nothing is bind-mounted. Coolify deploys from git onto a server whose
# filesystem nobody has prepared, so a compose file that assumes prepared
# directories fails with a message about a mount rather than about the thing
# that is actually missing. Everything lives in named volumes Docker creates.
#
# Coolify's own proxy owns 80 and 443 and terminates TLS, so nothing here
# publishes a port and there is no web server in this file. Set the domain on
# the "app" service in Coolify's UI - it writes the proxy labels itself, and
# hand-written ones drift the moment Coolify updates.
#
# THE APP SERVICE MUST NEVER BE SCALED. One replica is a correctness
# constraint, not a capacity choice: the stream registry in
# platform_core/agent_runtime/streaming.py is process-local, so with a second
# process a user's Stop silently fails to cancel a provider call the
# application is still being billed for. The per-token API rate limit is
# process-local for the same reason and would multiply by the replica count.

services:
  # Generates, once, the two things a deployment cannot start without: the
  # signing key and the database password. Both stay files - never environment
  # variables, never database rows - because read_secret in
  # digitalbrain/configuration.py refuses anything carrying group or other
  # permission bits.
  #
  # The password is written TWICE, deliberately. read_secret requires 0600 owned
  # by the application (uid 10001); Postgres runs as uid 70 and refuses to read
  # a file it does not own. No single file satisfies both without opening
  # permissions that read_secret would then reject, so each side gets its own
  # copy of one generated value.
  secrets-init:
    image: alpine:3.20
    restart: "no"
    volumes:
      - platform-secrets:/secrets
      - database-secret:/dbsecret
    command:
      - /bin/sh
      - -euc
      - |
        # Rotating the signing key invalidates every session, so an existing
        # one is never replaced - only a missing one is created.
        if [ ! -f /secrets/django_secret_key ]; then
          head -c 64 /dev/urandom | base64 | tr -d '\n=' > /secrets/django_secret_key
          echo "secrets: generated signing key"
        fi
        if [ ! -f /secrets/database_password ]; then
          head -c 32 /dev/urandom | base64 | tr -d '\n=+/' > /secrets/database_password
          echo "secrets: generated database password"
        fi
        cp /secrets/database_password /dbsecret/database_password
        chown -R 10001:10001 /secrets
        chmod 700 /secrets
        chmod 600 /secrets/django_secret_key /secrets/database_password
        chown -R 70:70 /dbsecret
        chmod 600 /dbsecret/database_password
        echo "secrets: ready"

  # Postgres is configured with sslmode=verify-full in digitalbrain/settings.py,
  # which means the client checks the server's certificate against a CA *and*
  # that the name matches. Nothing issues a certificate for a container, so one
  # is generated here on first boot and reused.
  postgres-certs:
    image: alpine:3.20
    restart: "no"
    volumes:
      - postgres-certs:/certs
    command:
      - /bin/sh
      - -euc
      - |
        if [ -f /certs/server.key ]; then
          echo "certs: already present"; exit 0
        fi
        apk add --no-cache openssl >/dev/null
        cd /certs
        openssl req -x509 -newkey rsa:4096 -sha256 -days 3650 -nodes \
          -keyout ca.key -out ca.crt -subj "/CN=digitalbrain-ca"
        openssl req -newkey rsa:4096 -sha256 -nodes \
          -keyout server.key -out server.csr -subj "/CN=postgres"
        # The SAN has to be the hostname the app connects to, or verify-full
        # rejects a certificate that is otherwise perfectly valid.
        printf "subjectAltName=DNS:postgres\n" > san.cnf
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
          -CAcreateserial -out server.crt -days 3650 -sha256 -extfile san.cnf
        rm -f server.csr san.cnf ca.srl
        # Refuse plaintext at the server too. The client already distrusts it
        # via sslmode=verify-full; saying it twice means neither statement is
        # load bearing on its own. "local" stays trusted so initdb and the
        # pg_isready healthcheck can use the unix socket.
        {
          echo "local   all  all               trust"
          echo "hostssl all  all  0.0.0.0/0    scram-sha-256"
          echo "hostssl all  all  ::/0         scram-sha-256"
        } > pg_hba.conf
        # Postgres refuses to start if its key is readable by anyone else.
        chown 70:70 server.key server.crt pg_hba.conf
        chmod 600 server.key
        chmod 644 server.crt ca.crt pg_hba.conf
        echo "certs: generated"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres-certs:
        condition: service_completed_successfully
      secrets-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: digital_brain
      POSTGRES_USER: digital_brain_app
      POSTGRES_PASSWORD_FILE: /run/dbsecret/database_password
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-certs:/certs:ro
      - database-secret:/run/dbsecret:ro
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - hba_file=/certs/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digital_brain_app -d digital_brain"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
    environment:
      # Non-secret settings, which the entrypoint renders into the TOML the
      # platform reads. No secret is ever here - those are files, by design.
      # Mounting your own /etc/digitalbrain/production.toml overrides all of it.
      DIGITAL_BRAIN_HOSTS: "ajitconnect.in,www.ajitconnect.in"
      DIGITAL_BRAIN_INSTANCE: "coolify-1"
      DIGITAL_BRAIN_PORT: "8000"
      # Coolify assigns its proxy's address at start, and waitress compares the
      # peer address as a literal string - so there is nothing stable to name.
      # Sound only because no port is published here. See scripts/serve.py.
      DIGITAL_BRAIN_TRUSTED_PROXY: "*"
      # The one non-secret .env value the platform accepts. Set it for the
      # first sign-in, then remove it.
      SITE_ADMIN_USER_ID: ${SITE_ADMIN_USER_ID:-}
    volumes:
      - platform-secrets:/run/secrets
      - postgres-certs:/var/lib/digitalbrain/pgcerts:ro
      # Writable, and deliberately a DIFFERENT directory from /run/secrets.
      # An application owner sets their own provider credentials on the
      # Credentials screen and they are written here - which is why a
      # credential an operator mounts into /run/secrets always wins over one
      # typed into a browser. Without this the screen says so rather than
      # offering a control that cannot work.
      - managed-credentials:/var/lib/digitalbrain/credentials
      # Uploaded originals, the rendered configuration and the event log.
      # Losing this loses every document's source bytes, so it belongs in the
      # backup set beside the database.
      - app-runtime:/app/.runtime
      # ClamAV signatures, ~1 GB. On a volume so a redeploy does not re-download
      # them and leave documents failing closed until it finishes.
      - clamav-db:/var/lib/clamav
    healthcheck:
      # See deploy/healthcheck.py: the request has to carry a hostname the
      # application allows, or Django answers 400 and the container never
      # reports healthy while serving perfectly.
      test: ["CMD", "python", "/app/deploy/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Generous: the first boot downloads ClamAV signatures before it listens.
      start_period: 600s

volumes:
  platform-secrets:
  managed-credentials:
  database-secret:
  postgres-data:
  postgres-certs:
  app-runtime:
  clamav-db:

name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.9.13"
      - run: uv sync --frozen --python 3.12
      - run: uv run python scripts/init_local.py
      - run: uv run ruff check digitalbrain platform_core scripts manage.py
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py collectstatic --noinput
      # The browser tests drive the Chrome GitHub's ubuntu image ships with
      # (Playwright's channel="chrome"). Checked here so a runner without it
      # fails loudly rather than letting those tests skip.
      - name: Browser for the end-to-end tests
        run: google-chrome --version
      - run: uv run python manage.py test
        env:
          # A missing Playwright or a browser that will not start fails the
          # run instead of skipping browser coverage silently.
          DIGITAL_BRAIN_REQUIRE_BROWSER: "1"
      - run: uv run python scripts/production_preflight.py
      - run: uv run python manage.py scorecard --check

  # The same suite and scorecard on PostgreSQL, which production runs: the
  # advisory lane locks, SKIP LOCKED job claims, full-text indexes and the
  # passage search exist only there, and SQLite passes without touching them.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brain
          # A throwaway server that lives for this job only.
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: digitalbrain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brain"
          --health-interval 5s --health-timeout 5s --health-retries 12
      # For the Redis stream tests' second run, against a real server: blocking
      # reads and expiry are where fakeredis is likeliest to be kind.
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.9.13"
      - run: uv sync --frozen --python 3.12
      - run: uv run python scripts/init_local.py
      # The password goes in a file in the secret directory, as everywhere
      # else; settings never read it from the environment.
      - name: Point the configuration at PostgreSQL
        run: |
          secrets=$(uv run python -c "import tomllib; print(tomllib.load(open('config/local.toml', 'rb'))['secret_directory'])")
          (umask 077 && printf '%s' ci-only > "$secrets/database_password")
          printf '\n[database]\nname = "digitalbrain"\nuser = "brain"\nhost = "127.0.0.1"\nport = 5432\n' >> config/local.toml
      - run: uv run python manage.py migrate --noinput
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py collectstatic --noinput
      - name: Browser for the end-to-end tests
        run: google-chrome --version
      - run: uv run python manage.py test
        env:
          DIGITAL_BRAIN_REQUIRE_BROWSER: "1"
          DIGITAL_BRAIN_TEST_REDIS: "127.0.0.1:6379"
          DIGITAL_BRAIN_REQUIRE_REDIS: "1"
      - run: uv run python manage.py scorecard --check

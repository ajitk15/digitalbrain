{% load icons %}<nav class="application-menu" aria-label="Application menu"><span class="application-menu-name"><span class="app-icon" aria-hidden="true">{% if application.logo_digest %}<img src="{% url 'application-logo' application.pk %}" alt="">{% elif application.identity_icon %}{% icon application.identity_icon 15 %}{% else %}{{ application.name|first|upper }}{% endif %}</span>{{ application.name }}</span>{% for item in items %}<a href="{{ item.url }}" {% if item.current %}aria-current="page"{% endif %}>{% icon item.icon %}{{ item.label }}</a>{% endfor %}</nav>

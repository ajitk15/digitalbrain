{% if item.active %}<a class="button secondary" href="{% url 'level-status' level item.pk %}" data-modal>Disable</a>{% else %}<form method="post" action="{% url 'level-status' level item.pk %}">{% csrf_token %}<button class="button secondary" name="state" value="enable">Enable</button></form>{% endif %}{% if item.active %}<button class="button danger" type="button" disabled title="Disable {{ item.name }} first: deleting is the second step.">Delete</button>{% else %}<form method="post" action="{% url 'level-delete' level item.pk %}" class="inline-form" data-confirm="Delete {{ item.name }} and everything in it? There is no undo.">{% csrf_token %}<label class="sr-only" for="delete-{{ item.pk }}">Type {{ item.name }} to delete it</label><input type="text" id="delete-{{ item.pk }}" name="confirm" placeholder="Type {{ item.name }}" autocomplete="off" required><button class="button danger" type="submit">Delete</button></form>{% endif %}

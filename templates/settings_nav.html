{% load icons %}{% if current_group %}<nav class="tabs settings-tabs" aria-label="Settings categories">{% for group in groups %}<a href="{{ group.url }}"{% if group.name == current_group.name %} class="selected" aria-current="true"{% endif %}>{% icon group.icon 15 %}{{ group.name }}</a>{% endfor %}</nav><nav class="settings-section-nav" aria-label="{{ current_group.name }} settings">{% for item in current_group.items %}<a href="{{ item.url }}"{% if item.current %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}</nav>{% endif %}

{% load icons %}<nav class="tabs settings-tabs" data-grouped aria-label="Settings sections">{% for name, found in groups %}<div class="settings-group" role="group" aria-label="{{ name }}"><span class="settings-group-label" aria-hidden="true">{{ name }}</span>{% for item in found %}<a href="{{ item.url }}" {% if item.current %}aria-current="page"{% endif %}>{% icon item.icon 13 %}{{ item.label }}</a>{% endfor %}</div>{% endfor %}</nav>

{% load icons %}{% comment %}One thing waiting on somebody. The Overview and the full list both render it from here, so the two cannot drift apart.{% endcomment %}<li class="attention-item attention-{{ item.tone }}"><span class="attention-icon" aria-hidden="true">{% icon item.icon 16 %}</span><span class="attention-text"><small>{{ item.application.name }}</small><strong>{{ item.text }}</strong></span><a class="button{% if item.tone != 'problem' %} secondary{% endif %}" href="{{ item.url }}">{{ item.action }}</a></li>

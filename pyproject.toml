[project]
name = "digital-brain"
version = "0.1.0"
description = "Application-isolated enterprise knowledge platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django>=5.2.17,<5.3",
  "django-axes>=8,<9",
  "argon2-cffi>=25.1,<26",
  "Pillow>=13.0,<14",
  "psycopg[binary]>=3.2,<4",
  "whitenoise>=6.9,<7",
  "waitress>=3,<4",
  "pypdf>=6.18,<7",
  "pypdfium2>=5.13,<6",
  "defusedxml>=0.7.1,<1",
  "markitdown[docx,outlook,pdf,pptx,xls,xlsx]>=0.1,<1",
  "openai-agents>=0.24.0,<0.25",
  "claude-agent-sdk>=0.2.168,<0.3",
  "graphifyy>=0.9.67,<0.10",
  "graspologic-native>=1.3,<2",
  "numpy>=2.0,<3",
  "rapidfuzz>=3.0,<4",
  "PyJWT[crypto]>=2.10,<3",
  # The authenticator seals its seeds with Fernet (`authenticator.py`).
  "cryptography>=50,<51",
  "redis>=8.1,<9",
  "anthropic>=1.11.0,<2",
  "boto3>=1.43.108,<2",
  "opentelemetry-sdk>=1.45.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.0,<2",
  "uvicorn>=0.52.4,<1",
  "a2wsgi>=1.10.10,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
    "coverage>=7.9,<8",
    "playwright>=1.49,<2",
    "fakeredis>=2.40,<3",
    "tblib>=3.1,<4",
]

[tool.uv]
# A boto3 pin leaves botocore free to take that day's release; hold it to the
# one published beside it.
constraint-dependencies = ["botocore<=1.43.108"]

[tool.coverage.run]
source = ["digitalbrain", "platform_core"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
# A floor under the 86% the suite measured when coverage was first taken, so a
# change that leaves new code untested shows; raise it with the suite, never
# lower it to pass.
fail_under = 85
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".runtime", ".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

